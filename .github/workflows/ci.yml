name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: go test
        if: steps.detect.outputs.present == 'true'
        run: go test -race -count=1 $(go list ./... | grep -v /node_modules/)
      - name: Skip (no go.mod)
        if: steps.detect.outputs.present != 'true'
        run: echo "No go.mod on this branch; skipping Go tests."

  node:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web package
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm test
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "web/package.json has no test script; skipping Node tests."
          fi
      - name: Skip (no web/package.json)
        if: steps.detect.outputs.present != 'true'
        run: echo "No web/package.json on this branch; skipping Node tests."
