<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Important locations</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12202b;
        --muted: #5b6b76;
        --line: #d7e0e6;
        --paper: #f6f8f9;
        --card: #ffffff;
        --accent: #0b6e4f;
        --accent-ink: #ffffff;
        --warn: #8a4b08;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.45;
      }
      header, main { max-width: 980px; margin: 0 auto; padding: 0 20px; }
      header { padding-top: 28px; padding-bottom: 8px; }
      h1 { margin: 0 0 6px; font-size: 1.6rem; }
      .lede { color: var(--muted); margin: 0 0 20px; }
      .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
      @media (min-width: 860px) {
        .grid { grid-template-columns: 320px 1fr; align-items: start; }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
      }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }
      button {
        margin-top: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.secondary { background: #2b3d4a; }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .empty { color: var(--muted); padding: 18px 4px; }
      .status { margin-top: 12px; font-size: 0.9rem; color: var(--muted); }
      .status.ok { color: var(--accent); }
      .status.warn { color: var(--warn); }
      .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
      code { font-size: 0.86em; }
    </style>
  </head>
  <body>
    <header>
      <h1>Important locations</h1>
      <p class="lede">
        When a vehicle sits still for 15 minutes inside 100 meters, that place is recorded.
        Send pings from the form or <code>POST /api/v1/pings</code>.
      </p>
    </header>
    <main class="grid">
      <section class="card">
        <h2>Record a ping</h2>
        <form id="ping-form">
          <label for="vehicleId">Vehicle</label>
          <input id="vehicleId" name="vehicleId" required placeholder="DEMO-1" value="DEMO-1" />
          <label for="lat">Latitude</label>
          <input id="lat" name="lat" required inputmode="decimal" value="40.7128" />
          <label for="lng">Longitude</label>
          <input id="lng" name="lng" required inputmode="decimal" value="-74.0060" />
          <label for="speedMph">Speed (mph)</label>
          <input id="speedMph" name="speedMph" inputmode="decimal" value="0" />
          <label for="recordedAt">Time (optional)</label>
          <input id="recordedAt" name="recordedAt" placeholder="leave blank for now" />
          <button type="submit">Send ping</button>
          <button type="button" class="secondary" id="sit-button">Simulate 16-minute sit</button>
        </form>
        <p id="status" class="status" role="status"></p>
      </section>
      <section class="card">
        <h2>Recorded places</h2>
        <p id="catalog-meta" class="meta"></p>
        <div id="table-wrap"></div>
      </section>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const tableWrap = document.getElementById("table-wrap");
      const catalogMeta = document.getElementById("catalog-meta");

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.className = "status " + (kind || "");
      }

      function fmt(value) {
        if (!value) return "—";
        return new Date(value).toLocaleString();
      }

      function renderLocations(payload) {
        catalogMeta.textContent =
          payload.count +
          " location" +
          (payload.count === 1 ? "" : "s") +
          " · sit threshold " +
          payload.dwellMinutes +
          " min / " +
          payload.dwellRadiusMeters +
          " m";
        if (!payload.locations.length) {
          tableWrap.innerHTML = '<p class="empty">No important locations yet. A vehicle has to sit still long enough.</p>';
          return;
        }
        const rows = payload.locations
          .map((loc) => {
            return (
              "<tr>" +
              "<td>" + loc.vehicleId + "</td>" +
              "<td>" + loc.lat.toFixed(5) + ", " + loc.lng.toFixed(5) + "</td>" +
              "<td>" + loc.dwellMinutes + " min</td>" +
              "<td>" + loc.visitCount + "</td>" +
              "<td>" + fmt(loc.lastSeenAt) + "</td>" +
              "</tr>"
            );
          })
          .join("");
        tableWrap.innerHTML =
          "<table><thead><tr><th>Vehicle</th><th>Location</th><th>Dwell</th><th>Visits</th><th>Last seen</th></tr></thead><tbody>" +
          rows +
          "</tbody></table>";
      }

      async function refresh() {
        const response = await fetch("/api/v1/important-locations");
        renderLocations(await response.json());
      }

      async function sendPing(body) {
        const response = await fetch("/api/v1/pings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (result.recorded) {
          setStatus("Recorded important location for " + result.vehicleId + " (" + result.reason + ").", "ok");
        } else {
          setStatus("Not recorded: " + result.reason + ".", "warn");
        }
        await refresh();
        return result;
      }

      document.getElementById("ping-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        const recordedAt = String(data.get("recordedAt") || "").trim();
        await sendPing({
          vehicleId: data.get("vehicleId"),
          lat: Number(data.get("lat")),
          lng: Number(data.get("lng")),
          speedMph: data.get("speedMph") === "" ? null : Number(data.get("speedMph")),
          recordedAt: recordedAt || undefined,
        });
      });

      document.getElementById("sit-button").addEventListener("click", async () => {
        const vehicleId = document.getElementById("vehicleId").value.trim();
        const lat = Number(document.getElementById("lat").value);
        const lng = Number(document.getElementById("lng").value);
        const start = new Date();
        await sendPing({ vehicleId, lat, lng, speedMph: 0, recordedAt: start.toISOString() });
        const later = new Date(start.getTime() + 16 * 60 * 1000);
        await sendPing({ vehicleId, lat, lng, speedMph: 0, recordedAt: later.toISOString() });
      });

      refresh().catch((error) => setStatus(error.message, "warn"));
    </script>
  </body>
</html>
